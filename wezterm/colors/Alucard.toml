# Alucard — same palette as ghostty/themes/Alucard
# https://github.com/jaljoue/dracula-alucard.nvim

[colors]
foreground = "#1f1f1f"
background = "#fffbeb"
cursor_bg = "#644ac9"
cursor_border = "#644ac9"
cursor_fg = "#fffbeb"
selection_fg = "#1f1f1f"
selection_bg = "#cfcfde"

ansi = [
  "#1f1f1f",
  "#cb3a2a",
  "#14710a",
  "#846e15",
  "#644ac9",
  "#a3144d",
  "#036a96",
  "#4a4a4a",
]
brights = [
  "#6c664b",
  "#e85b4f",
  "#3a9b2d",
  "#a58b1a",
  "#8a6fe0",
  "#c43f6e",
  "#1a8fbf",
  "#ffffff",
]

[colors.tab_bar]
background = "#fffbeb"
inactive_tab_edge = "#cfcfde"

[colors.tab_bar.active_tab]
fg_color = "#644ac9"
bg_color = "#fffbeb"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
fg_color = "#6c664b"
bg_color = "#fffbeb"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#644ac9"
bg_color = "#fffbeb"

[colors.tab_bar.new_tab]
fg_color = "#644ac9"
bg_color = "#fffbeb"

[colors.tab_bar.new_tab_hover]
fg_color = "#fffbeb"
bg_color = "#644ac9"

[metadata]
name = "Alucard"
author = "jaljoue"
origin_url = "https://github.com/jaljoue/dracula-alucard.nvim"
